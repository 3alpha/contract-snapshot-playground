[package]
name = "snapshot-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser-local REVM execution against Reth account snapshots"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
alloy-dyn-abi.workspace = true
alloy-json-abi.workspace = true
alloy-primitives.workspace = true
revm = { workspace = true, features = [
    "std",
    "portable",
    "memory_limit",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_fee_charge",
    "optional_no_base_fee",
] }
serde.workspace = true
serde_json.workspace = true
snapshot-format.workspace = true
wasm-bindgen = "=0.2.127"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A transitive crypto dependency uses getrandom 0.2. Select its browser entropy backend only for
# the WASM build; native snapshot tooling keeps its existing OS-backed configuration.
getrandom = { version = "=0.2.17", features = ["js"] }
