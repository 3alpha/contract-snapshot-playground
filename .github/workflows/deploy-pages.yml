name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [master]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel a queued run when a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins channel 1.95.0 and already lists the wasm32 target.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/snapshot-web/ui/package-lock.json

      - name: Install dependencies
        working-directory: crates/snapshot-web/ui
        run: npm ci

      # Runs `wasm-pack build`, `tsc` typechecks, then `vite build` into dist/.
      - name: Build UI
        working-directory: crates/snapshot-web/ui
        run: npm run build

      # GitHub Pages runs Jekyll by default; disable it so all assets are served as-is.
      - name: Disable Jekyll processing
        run: touch crates/snapshot-web/ui/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/snapshot-web/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
