[workspace]
members = [
    "crates/reth-contract-snapshot",
    "crates/snapshot-format",
    "crates/snapshot-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
alloy-dyn-abi = "=1.6.1"
alloy-evm = "=0.39.0"
alloy-json-abi = { version = "=1.6.1", features = ["serde_json"] }
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-rlp = "=0.3.16"
alloy-trie = { version = "=0.9.5", features = ["ethereum"] }
revm = { version = "=43.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snapshot-format = { path = "crates/snapshot-format" }

[profile.release]
lto = "thin"
